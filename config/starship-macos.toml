# FluxEnv macOS prompt. Tuned for Terminal Pro's dark background.
palette = "fluxenv_pro"
add_newline = false
command_timeout = 500

[palettes.fluxenv_pro]
text = "#E6EDF3"
muted = "#8B949E"
user = "#8FB8D8"
host = "#78C7C7"
path = "#D8DEE9"
branch = "#C4A7E7"
status = "#E5A97B"
success = "#A8D5BA"
error = "#E78A8A"
quote = "#D6B48C"

format = """
[╭─](fg:muted)$username$hostname$directory$git_branch$git_status
[╰─](fg:muted)$character """

[username]
style_user = "fg:user"
style_root = "fg:error"
format = "[$user]($style)"
show_always = true

[hostname]
ssh_only = false
format = "[@$hostname]($style) "
trim_at = "."
style = "fg:host"

[python]
disabled = true

[java]
disabled = true

[nodejs]
disabled = true

[golang]
disabled = true

[directory]
style = "fg:path"
truncation_length = 4
truncation_symbol = "…/"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = "on "
style = "fg:branch"
format = "[$symbol$branch]($style)"

[git_status]
disabled = false
format = ' [$all_status$ahead_behind]($style)'
style = "fg:status"
staged = "[+ ](fg:success)"
modified = "[! ](fg:status)"
untracked = "[? ](fg:muted)"
deleted = "[✘ ](fg:error)"
renamed = "[» ](fg:branch)"
conflicted = "[= ](fg:error)"
stashed = "[$ ](fg:host)"
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
up_to_date = ""

[conda]
disabled = true
ignore_base = false
style = "fg:success"
symbol = ""
format = '[\($symbol$environment\)]($style) '

[character]
success_symbol = "[❯](fg:success)"
error_symbol = "[❯](fg:error)"
vimcmd_symbol = "[❮](fg:branch)"
