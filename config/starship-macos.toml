# FluxEnv macOS prompt. Keep the layout native; Terminal.app owns the palette.
add_newline = false
command_timeout = 500

[username]
style_user = "bright-green bold"
style_root = "bright-red bold"
format = "[$user]($style)"
show_always = true

[hostname]
ssh_only = false
format = "[@$hostname]($style) "
trim_at = "."
style = "bright-cyan"

[python]
disabled = true

[java]
disabled = true

[nodejs]
disabled = true

[golang]
disabled = true

[directory]
style = "bright-white"
truncation_length = 4
truncation_symbol = "…/"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = "on "
style = "bright-purple bold"
format = "[$symbol](bright-cyan)[$branch]($style)"

[git_status]
disabled = false
format = ' [$all_status$ahead_behind]($style)'
style = "bright-red bold"
staged = "[+ ](bright-green)"
modified = "[! ](bright-red)"
untracked = "[? ](bright-yellow)"
deleted = "[✘ ](bright-red)"
renamed = "[» ](bright-purple)"
conflicted = "[= ](bright-red bold)"
stashed = "[$ ](bright-cyan)"
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
up_to_date = ""

[conda]
disabled = true
ignore_base = false
style = "bright-green bold"
symbol = ""
format = '[\($symbol$environment\)]($style) '

[character]
success_symbol = "[❯](bright-green bold)"
error_symbol = "[❯](bright-red bold)"
vimcmd_symbol = "[❮](bright-purple bold)"

[cmd_duration]
style = "bright-cyan"
